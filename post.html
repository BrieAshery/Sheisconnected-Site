<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Post — Sheisconnected Initiative</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="index.html"><img src="images/logo-white-cropped.png" alt="Sheisconnected" class="nav-logo"></a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="programs.html">Programs</a>
      <a href="gallery.html">Gallery</a>
      <a href="blog.html">Blog</a>
      <a href="contact.html">Contact</a>
    </div>
  </div>
</nav>
<div class="gold-strip"></div>

<section class="light-section">
  <div class="wrap">
    <a href="blog.html" class="back-to-blog">← Back to Blog</a>
    <div id="post-content">
      <p>Loading…</p>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <img src="images/logo-icon-cropped.png" alt="" class="footer-logo">
    <h2>Contact Us</h2>
    <p class="lead">For partnerships, funding, or questions about our programs.</p>
    <div class="social-row">
      <a href="https://www.facebook.com/sheisconnected/" target="_blank">Facebook</a>
      <a href="https://www.instagram.com/she_is_connected/" target="_blank">Instagram</a>
      <a href="https://www.linkedin.com/company/sheisconnected/" target="_blank">LinkedIn</a>
    </div>
    <div class="footer-links">Sheisconnected Initiative &copy; 2026</div>
  </div>
</footer>

<script>
  (async () => {
    const params = new URLSearchParams(window.location.search);
    const slug = params.get("slug");
    const contentEl = document.getElementById("post-content");

    if (!slug) {
      contentEl.innerHTML = "<p>No post specified.</p>";
      return;
    }

    try {
      const res = await fetch("content/posts/" + slug + ".json?v=" + Date.now());
      if (!res.ok) throw new Error("Post not found");
      const post = await res.json();

      document.getElementById("page-title").textContent = post.title + " — Sheisconnected Initiative";

      const paragraphs = (post.body || "")
        .split("\n\n")
        .filter((p) => p.trim())
        .map((p) => "<p>" + p.replace(/\n/g, "<br>") + "</p>")
        .join("");

      contentEl.innerHTML =
        (post.image ? '<img class="post-cover" src="' + post.image + '" alt="">' : "") +
        '<div class="post-date">' + new Date(post.date).toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" }) + '</div>' +
        '<h1 style="margin-bottom:20px;">' + post.title + '</h1>' +
        '<div class="post-body">' + paragraphs + '</div>';
    } catch (err) {
      contentEl.innerHTML = "<p>This post could not be found.</p>";
    }
  })();
</script>

</body>
</html>
